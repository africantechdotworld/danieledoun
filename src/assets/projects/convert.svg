<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Background Rectangle -->
  <rect width="600" height="300" fill="#f0f0f0" rx="15" ry="15" />
  
  <!-- Centered Logo -->
  <g transform="translate(150, 0)">
    <!-- Background Circle -->
    <circle cx="150" cy="130" r="100" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" />
    
    <!-- Currency Conversion Arrow -->
    <path d="M85 110 L215 110 L185 80 M215 160 L85 160 L115 190" 
          stroke="#3498db" 
          stroke-width="10" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Currency Symbols -->
    <text x="110" y="150" 
          font-family="Arial, sans-serif" 
          font-size="40" 
          font-weight="bold" 
          fill="#2c3e50">$</text>
    
    <text x="170" y="150" 
          font-family="Arial, sans-serif" 
          font-size="40" 
          font-weight="bold" 
          fill="#2c3e50">€</text>
  </g>
  
  <!-- App Name -->
  <text x="300" y="260" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="#2c3e50" 
        text-anchor="middle">Convert</text>
</svg>